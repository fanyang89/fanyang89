name: Update README

on:
  schedule:
    - cron: '17 3 1 1,7 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activity:
    name: Update README with recent merged upstream pull requests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update merged pull requests in README
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs')

            const username = 'fanyang89'
            const readmePath = 'README.md'
            const startMarker = '<!--START_SECTION:activity-->'
            const endMarker = '<!--END_SECTION:activity-->'
            const maxRepos = 5
            const maxPullRequestsPerRepo = 2

            const query = `
              query RecentMergedPullRequests($searchQuery: String!, $cursor: String) {
                search(query: $searchQuery, type: ISSUE, first: 100, after: $cursor) {
                  issueCount
                  pageInfo {
                    hasNextPage
                    endCursor
                  }
                  nodes {
                    ... on PullRequest {
                      title
                      number
                      url
                      mergedAt
                      repository {
                        nameWithOwner
                        isPrivate
                      }
                    }
                  }
                }
              }
            `

            const since = new Date()
            since.setUTCDate(1)
            since.setUTCMonth(since.getUTCMonth() - 6)
            const searchQuery = `author:${username} -user:${username} is:public is:pr is:merged merged:>=${since.toISOString().slice(0, 10)}`
            const nodes = []
            let cursor = null
            do {
              const response = await github.graphql(query, { searchQuery, cursor })
              if (response.search.issueCount > 1000) {
                throw new Error('Search exceeds GitHub’s 1,000-result limit; narrow the merge-date window')
              }
              nodes.push(...response.search.nodes)
              cursor = response.search.pageInfo.hasNextPage ? response.search.pageInfo.endCursor : null
            } while (cursor)

            const pullRequests = nodes
              .filter((pr) => pr && pr.mergedAt && pr.repository && !pr.repository.isPrivate
                && pr.repository.nameWithOwner.split('/')[0].toLowerCase() !== username.toLowerCase())
              .sort((left, right) => new Date(right.mergedAt) - new Date(left.mergedAt))

            const escapeTitle = (title) => title.replace(/[\\\[\]]/g, '\\$&')
            const groupedPullRequests = new Map()

            for (const pr of pullRequests) {
              const repo = pr.repository.nameWithOwner

              if (!groupedPullRequests.has(repo)) {
                if (groupedPullRequests.size === maxRepos) {
                  continue
                }

                groupedPullRequests.set(repo, [])
              }

              const repoPullRequests = groupedPullRequests.get(repo)
              if (repoPullRequests.length < maxPullRequestsPerRepo) {
                repoPullRequests.push(pr)
              }
            }

            const content = groupedPullRequests.size
              ? Array.from(groupedPullRequests.entries())
                  .map(([repo, prs]) => {
                    const lines = prs
                      .map((pr) => `- 🔀 [#${pr.number} ${escapeTitle(pr.title)}](${pr.url})`)
                      .join('\n')
                    return `### ${repo}\n${lines}`
                  })
                  .join('\n\n')
              : '- No upstream pull requests merged in the past six months.'

            const readme = fs.readFileSync(readmePath, 'utf8')
            const startIndex = readme.indexOf(startMarker)
            const endIndex = readme.indexOf(endMarker)

            if (startIndex === -1 || endIndex === -1 || endIndex < startIndex) {
              throw new Error('README activity markers not found')
            }

            const updatedReadme = `${readme.slice(0, startIndex + startMarker.length)}\n${content}\n${readme.slice(endIndex)}`

            fs.writeFileSync(readmePath, updatedReadme)

      - name: Commit README updates
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi

          git add README.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs(readme): update merged pull requests'
          git push
